name: 'Build'

on:
  workflow_call:
    inputs:
      image:
        description: 'Docker image to be used in workflow.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Lint'
        run: npm run lint
        shell: bash
  build-development:
    name: 'Development'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Build'
        run: npm run build
        shell: bash
      - name: 'Upload'
        uses: actions/upload-artifact@v6
        with:
          name: commissions
          path: ./dist
  build-production:
    name: 'Production'
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
      options: --user 1001
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Install'
        uses: ./.github/actions/install
      - name: 'Build (Prod)'
        run: BASE_PATH=/commissions/${{ github.ref_name }}/ npm run build
        shell: bash
      - name: 'Upload'
        uses: actions/upload-artifact@v6
        with:
          name: commissions-prod
          path: ./dist
